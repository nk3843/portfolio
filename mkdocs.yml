site_name: Nikhil Kumar | AI & Data Engineer
site_url: https://nk3843.github.io/portfolio/
repo_url: https://github.com/nk3843/
repo_name: nk3843

theme:
  name: material
  palette: 
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate # Dark mode
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences